name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config file with secrets
        run: |
          cat > config-prod.js << EOF
          const CONFIG = {
            SUPABASE_KEY: '${{ secrets.SUPABASE_KEY }}',
            EMAILJS_KEY: '${{ secrets.EMAILJS_KEY }}',
            GROQ_KEY: '${{ secrets.GROQ_KEY }}'
          };
          EOF

      - name: Inject config into borang.html
        run: |
          # Replace placeholder config loading with production config
          sed -i 's|<script src="config-local.js"></script>|<script src="config-prod.js"></script>|g' borang.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
