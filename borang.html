/* ---- PROGRESS BAR ---- */
.progress-wrapper {
  background: var(--white);
  border-bottom: 1px solid var(--grey-100);
  padding: 0;
  position: sticky; top: 0; z-index: 100;

}
.progress-steps {
  display: flex;

}
.progress-steps::-webkit-scrollbar { display: none; }
.step-item {
  flex: 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 6px 10px;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
  border-bottom: 3px solid transparent;
}
.step-item:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0; top: 22px;
  width: 1px; height: 20px;
  background: var(--grey-200);
}
.step-item.active {
  background: var(--bg-light);
  border-bottom-color: var(--primary);
}
.step-item.done { border-bottom-color: var(--red); }
.step-num {
  width: 32px; height: 32px;
  border-radius: 50%;

  font-size: 0.85rem;
  font-weight: 600;
  background: var(--grey-100);
  color: var(--grey-500);
  transition: all 0.2s;
  margin-bottom: 6px;
}
.step-item.active .step-num { background: var(--primary); color: white; }
.step-item.done .step-num { background: var(--red); color: white; }

  font-size: 0.72rem;
  color: var(--grey-500);
  text-align: center;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  line-height: 1.3;
}
.step-item.active .step-label { color: var(--primary); }
.step-item.done .step-label { color: var(--red); }

  margin: 32px auto;
  padding: 0 16px 60px;
}

}

  }

}

}

.form-section {

}
.section-heading {

}
.section-heading::before {
  content: '';
  display: inline-block;
  width: 3px; height: 16px;
  background: var(--accent);
  border-radius: 2px;
}

.form-row { display: grid; gap: 16px; margin-bottom: 14px; }
.form-row.cols-2 { grid-template-columns: 1fr 1fr; }
.form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-row.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
@media (max-width: 600px) {
  .form-row.cols-2,
  .form-row.cols-3,
  .form-row.cols-4 { grid-template-columns: 1fr; }
}

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text);
  display: flex; align-items: center; gap: 4px;
}
.req { color: var(--error); font-size: 0.85em; }

.form-control {
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 11px 15px;
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  color: var(--text);
  background: var(--bg-card);
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  width: 100%;
  outline: none;
}
.form-control:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(43,108,177,0.08);
  transform: translateY(-1px);
}
.form-control.error { 
  border-color: var(--error); 
  background: rgba(197, 48, 48, 0.05);
  animation: shake 0.3s ease-in-out;
}
.form-control.success {
  border-color: var(--success);
  background: rgba(45, 106, 79, 0.05);
}
.form-control:disabled {
  background: var(--grey-50); 
  color: var(--text-muted); 
  cursor: not-allowed;
  opacity: 0.7;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

select.form-control { cursor: pointer; }
textarea.form-control { resize: vertical; min-height: 80px; }

.form-hint {
  font-size: 0.77rem;
  color: var(--text-muted);
  margin-top: 2px;
}
.field-error {
  font-size: 0.77rem;
  color: var(--error);
  display: none;
  margin-top: 4px;
  padding: 6px 10px;
  background: rgba(197, 48, 48, 0.1);
  border-left: 3px solid var(--error);
  border-radius: 4px;
  animation: slideDown 0.2s ease-out;
}
.field-error.show { 
  display: block; 
}
.captcha-container {
  margin: 20px 0;
  display: flex;
  justify-content: center;
}
.captcha-container .cf-turnstile {
  margin: 0 auto;
}
.field-success {
  font-size: 0.77rem;
  color: var(--success);
  margin-top: 4px;
  padding: 6px 10px;
  background: rgba(45, 106, 79, 0.1);
  border-left: 3px solid var(--success);
  border-radius: 4px;
  display: none;
}
.field-success.show {
  display: block;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ---- RADIO / CHECKBOX GROUP ---- */
.radio-group, .check-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}
.radio-item, .check-item {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-light);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 8px 15px;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 0.92rem;
  position: relative;
}
.radio-item:hover, .check-item:hover {
  border-color: var(--accent);
  background: var(--grey-100);
  transform: translateY(-1px);
}
.radio-item:focus-within, .check-item:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.radio-item input[type="radio"],
.check-item input[type="checkbox"] { 
  cursor: pointer; 
  accent-color: var(--primary); 
  position: relative;
  opacity: 1;
  width: auto;
  height: auto;
  margin: 0 8px 0 0;
  z-index: 2;
}
.radio-item.selected { 
  border-color: var(--primary); 
  background: rgba(26,54,93,0.07); 
  color: var(--primary); 
  font-weight: 600; 
  box-shadow: 0 2px 8px rgba(26,54,93,0.15);
}
.radio-item::before, .check-item::before {
  display: none;
}

/* ---- JENIS KEAHLIAN CARDS ---- */
.keahlian-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
@media (max-width: 500px) { .keahlian-grid { grid-template-columns: 1fr; } }

.keahlian-card {
  border: 2px solid var(--grey-200);
  border-radius: 10px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.keahlian-card:hover { border-color: var(--navy-light); background: var(--grey-50); }
.keahlian-card.selected {
  border-color: var(--navy);
  background: rgba(13,32,96,0.04);
  box-shadow: 0 0 0 3px rgba(13,32,96,0.1);
}
.keahlian-card input[type="radio"] {
  position: absolute; top: 14px; right: 14px;
  accent-color: var(--navy); transform: scale(1.2);
}
.keahlian-badge {
  display: inline-block;
  background: var(--navy);
  color: white;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 12px;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.keahlian-card.selected .keahlian-badge { background: var(--red); color: white; }
.keahlian-card h4 { font-size: 0.92rem; color: var(--grey-800); margin-bottom: 4px; }

.yuran-box {

}

}

  font-size: 0.88rem;
}
.yuran-row:last-child { border-bottom: none; }
.yuran-row span:last-child { font-weight: 600; color: white; }

.data-table {
  width: 100%;

  font-size: 0.87rem;
}
.data-table th {
  background: var(--grey-50);
  color: var(--grey-600);

}

}
.tempoh-card:hover { border-color: var(--navy-light); }
.tempoh-card.selected { border-color: var(--navy); background: rgba(13,32,96,0.05); }
.tempoh-card input[type="radio"] { position: absolute; opacity: 0; }
.tempoh-card .tempoh-num { font-size: 1.6rem; font-weight: 700; color: var(--navy); line-height: 1; }
.tempoh-card .tempoh-label { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; }
.tempoh-card .tempoh-amount { font-size: 0.95rem; font-weight: 700; color: var(--navy-mid); }
.tempoh-card .tempoh-badge {
  position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
  background: var(--red); color: white;
  font-size: 0.65rem; font-weight: 700;
  padding: 2px 9px; border-radius: 10px;
  white-space: nowrap;
}

.bank-info {
  background: var(--grey-50);
  border: 1px solid var(--grey-200);
  border-radius: 9px;
  padding: 16px 20px;
  margin-bottom: 20px;
}
.bank-info h5 { color: var(--navy); font-weight: 700; margin-bottom: 10px; font-size: 0.88rem; text-transform: uppercase; letter-spacing: 0.07em; }
.bank-row { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--grey-100); font-size: 0.88rem; }
.bank-row:last-child { border-bottom: none; }
.bank-row .bank-key { color: var(--text-muted); width: 130px; flex-shrink: 0; font-size: 0.82rem; }
.bank-row .bank-val { font-weight: 600; color: var(--text); }

.amaran-box {
  background: var(--warning-bg);
  border: 1.5px solid #e8b800;
  border-radius: 9px;
  padding: 14px 18px;
  font-size: 0.85rem;
  color: var(--warning);
  margin-bottom: 20px;
  display: flex; gap: 10px; align-items: flex-start;
}
.amaran-box .amaran-icon { font-size: 1.1rem; flex-shrink: 0; }

/* ---- SEMAK & RINGKASAN ---- */
.ringkasan-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border: 1px solid var(--grey-200);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 20px;
}
@media (max-width: 600px) { .ringkasan-grid { grid-template-columns: 1fr; } }

.ringkasan-group { padding: 16px 20px; border-bottom: 1px solid var(--grey-100); }
.ringkasan-group:nth-child(odd) { border-right: 1px solid var(--grey-100); }
.ringkasan-group h5 {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--grey-400);
  margin-bottom: 4px;
}
.ringkasan-group p { font-size: 0.9rem; color: var(--text); font-weight: 500; }

.akuan-section {
  border: 1.5px solid var(--grey-200);
  border-radius: 9px;
  padding: 18px 20px;
  margin-bottom: 20px;
  background: var(--grey-50);
}
.akuan-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 10px 0;
  font-size: 0.88rem;
  line-height: 1.5;
}
.akuan-item:last-child { border-bottom: none; padding-bottom: 0; }
.akuan-item input[type="checkbox"] {
  accent-color: var(--navy);
  transform: scale(1.3);
  margin-top: 2px;
  flex-shrink: 0;
  cursor: pointer;
}

.nota-pdf {
  background: rgba(13,32,96,0.05);
  border: 1px solid var(--grey-200);
  border-left: 3px solid var(--navy);
  border-radius: 8px;
  padding: 14px 18px;
  font-size: 0.85rem;
  margin-bottom: 20px;
}
.nota-pdf h5 { color: var(--navy); font-weight: 700; margin-bottom: 8px; }
.nota-pdf ol { padding-left: 18px; }
.nota-pdf li { margin-bottom: 4px; color: var(--text-muted); }

/* ---- BUTTONS ---- */
.btn-row { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin-top: 32px; }
.btn {
  padding: 12px 32px;
  border-radius: 6px;
  font-family: 'Inter', sans-serif;
  font-size: 0.96rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 8px;
  letter-spacing: 0.01em;
  position: relative;
  overflow: hidden;
}
.btn:focus {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn:disabled { 
  opacity: 0.5; 
  cursor: not-allowed; 
  transform: none !important;
}
.btn:active {
  transform: scale(0.98);
}
.btn-primary {
  background: var(--primary);
  color: white;
  box-shadow: 0 2px 8px rgba(11,37,69,0.2);
}
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(11,37,69,0.3); }
.btn-secondary {
  background: var(--bg-card);
  color: var(--primary);
  border: 1.5px solid var(--border);
}
.btn-secondary:hover { border-color: var(--accent); background: var(--bg-light); }
.btn-gold {
  background: var(--red);
  color: white;
  box-shadow: 0 2px 8px rgba(196,18,48,0.25);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  position: relative;
  overflow: hidden;
}
.btn-gold:hover:not(:disabled) { 
  transform: translateY(-1px); 
  box-shadow: 0 4px 16px rgba(204,22,40,0.35); 
  background: #A8112C;
}
.btn-gold:active:not(:disabled) {
  transform: translateY(0) scale(0.98);
}
.btn-lg { padding: 16px 40px; font-size: 1.05rem; }

/* ---- SUCCESS SCREEN ---- */
#screen-success { display: none; }
.success-card {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 55px 45px;
  text-align: center;
  box-shadow: var(--shadow-lg);
}
.success-card h2 {
  font-family: 'Montserrat', sans-serif;
  color: var(--primary);
  font-size: 2.2rem;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  line-height: 1.2;
}
.ref-box {
  background: #f8f9fa;
  border: 2px solid var(--primary);
  border-radius: 8px;
  padding: 18px 26px;
  margin: 24px auto;
  max-width: 100%;
  text-align: center;
}
.ref-box .ref-label { font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
.ref-box .ref-num { font-size: 1.8rem; font-weight: 700; color: var(--primary); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; }
.seterusnya-list {
  text-align: center;
  max-width: 460px;
  margin: 0 auto 32px;
  padding: 22px 26px;
  background: var(--bg-light);
  border-radius: 8px;
}
.seterusnya-list h5 { color: var(--primary); font-weight: 700; margin-bottom: 14px; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.08em; }
.seterusnya-list ol { padding-left: 20px; text-align: left; }
.seterusnya-list li { margin-bottom: 10px; font-size: 0.92rem; color: var(--text-muted); }

/* ---- TOAST ---- */
#toast {
  position: fixed;
  bottom: 28px; right: 28px;
  background: var(--grey-800);
  color: white;
  padding: 12px 20px;
  border-radius: 9px;
  font-size: 0.88rem;
  font-weight: 500;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  z-index: 9999;
  max-width: 340px;
  display: flex;
  align-items: center;
  gap: 10px;
  backdrop-filter: blur(8px);
}
#toast.show { 
  transform: translateY(0); 
  opacity: 1;
  animation: toastSlide 0.4s ease-out;
}
#toast.success { 
  background: var(--primary);
  border-left: 4px solid var(--primary-dark);
}
#toast.error { 
  background: var(--red);
  border-left: 4px solid #8B0A1A;
}
#toast.warning {
  background: #B45309;
  border-left: 4px solid #92400E;
}
#toast.info {
  background: var(--navy);
  border-left: 4px solid var(--primary-dark);
}
#toast::before {
  content: '';
  width: 20px;
  height: 20px;
  border-radius: 50%;
  flex-shrink: 0;
}
#toast.success::before {
  content: '✓';
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}
#toast.error::before {
  content: '✕';
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}
#toast.warning::before {
  content: '⚠';
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}
#toast.info::before {
  content: 'ℹ';
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

@keyframes toastSlide {
  0% {
    transform: translateY(100px) rotateX(90deg);
    opacity: 0;
  }
  100% {
    transform: translateY(0) rotateX(0);
    opacity: 1;
  }
}
</style>
